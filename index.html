<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Color Grid</title>
    <link rel="stylesheet" type="text/css" href="./styles.css">
</head>

<body>

    <div class="ui">

        <button id="gridSize">Change Grid Size</button>

        <button id="modeSelect">Mode: Normal</button>

        <button id="eraser">Eraser: Off</button>

        <div class="gridNumber">10 x 10</div>

        <button id="reset">Reset</button>

    </div>

    <div class="container"></div>


    <script>

        // Set up variable names
        const container = document.querySelector('.container');
        const gridSizeBtn = document.querySelector('#gridSize');
        const resetBtn = document.querySelector('#reset');
        const gridCounter = document.querySelector('.gridNumber');
        const modeSelect = document.querySelector('#modeSelect');
        const eraserBtn = document.querySelector('#eraser');


        // Set up variable to reset current selected grid size
        let latestSquareSize = 10;


        // Modes: normal, color, grey
        let mode = 'normal';


        // Eraser mode
        let eraserMode = false;


        // Initialize with 10 x 10 grid
        setSides(latestSquareSize);


        // Create grid
        function setSides(numSquares) {

            // Remove current grid first
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }
            let widthPercent;
            // Set up RGB random values
            let r;
            let g;
            let b;


            // Create new grid
            for (let i = 0; i < (numSquares ** 2); i++) {

                // Creating new square div
                const square = document.createElement('div');


                // Setting border on new square div
                square.style.border = '1px solid black';


                // Calculate what percentage each box must be
                widthPercent = 100 / numSquares;


                // Change square's width value
                square.style.width = `${widthPercent}%`;


                // Set square's initial color to white
                square.style.background = "white";


                // Add square class
                square.classList.add('square');


                // Append square to container
                container.appendChild(square);
            }


            // Make squares hoverable
            const squares = document.querySelectorAll('div.square');


            squares.forEach((square) => {

                square.addEventListener('mouseover', () => {


                    if (eraserMode) {

                        square.style.backgroundColor = 'white';

                        return;
                    }
                    if (mode === 'normal') {

                        square.style.backgroundColor = 'black';

                    }
                    else if (mode === 'color') {

                        r = Math.floor(Math.random() * 256);
                        g = Math.floor(Math.random() * 256);
                        b = Math.floor(Math.random() * 256);

                        square.style.backgroundColor =
                            `rgb(${r}, ${g}, ${b})`;

                    }
                    else {

                        let currentColor =
                            window.getComputedStyle(square).backgroundColor;

                        let rgbValues =
                            currentColor.match(/\d+/g);

                        let currentRGB =
                            parseInt(rgbValues[0]);

                        let nextRGB =
                            Math.max(0, currentRGB - 26);

                        square.style.backgroundColor =
                            `rgb(${nextRGB}, ${nextRGB}, ${nextRGB})`;
                    }

                });

            });

        }

        eraserBtn.addEventListener('click', () => {

            eraserMode = !eraserMode;


            if (eraserMode) {

                eraserBtn.textContent = 'Eraser: On';

            } else {

                eraserBtn.textContent = 'Eraser: Off';

            }

        });
        gridSizeBtn.addEventListener('click', () => {

            let squareSide =
                prompt('Choose 1 - 100 squares per side');


            // If user cancels
            if (squareSide === null) {
                return;
            }


            // Convert input to number
            squareSide = Number(squareSide);


            // If input is empty or invalid
            if (!squareSide || squareSide < 1) {

                squareSide = 1;

            }


            // If user asks for more than 100
            if (squareSide > 100) {

                alert('Setting to 100');

                squareSide = 100;

            }


            // Create new grid
            setSides(squareSide);


            // Set latestSquareSize for reset
            latestSquareSize = squareSide;


            // Update grid counter
            gridCounter.textContent =
                latestSquareSize + ' x ' + latestSquareSize;

        });
        resetBtn.addEventListener('click', () => {

            setSides(latestSquareSize);

        });
        modeSelect.addEventListener('click', () => {

            if (mode === 'normal') {

                mode = 'color';

                modeSelect.textContent = 'Mode: Color';

            }

            else if (mode === 'color') {

                mode = 'grey';

                modeSelect.textContent = 'Mode: Grey';

            }

            else {

                mode = 'normal';

                modeSelect.textContent = 'Mode: Normal';

            }

        });

    </script>

</body>

</html>
